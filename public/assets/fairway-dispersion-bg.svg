      <stop offset="0" stop-color="#1f3f25" />
      <stop offset="0.45" stop-color="#30592e" />
      <stop offset="1" stop-color="#18341e" />
    </linearGradient>
    <linearGradient id="fairwayBase" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#86ad54" />
      <stop offset="0.5" stop-color="#6e9847" />
      <stop offset="1" stop-color="#4f7839" />

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    # React Three Fiber 9.6.1 requires React and React DOM below 19.3.
    ignore:
      - dependency-name: react
        versions: [">=19.3.0"]
      - dependency-name: react-dom
        versions: [">=19.3.0"]
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
      testing:
        patterns: ["@playwright/*", "vitest", "axe-core", "lighthouse"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

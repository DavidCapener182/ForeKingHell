name: Course Twin Builder Image

on:
  workflow_dispatch:
  push:
    branches: [main, codex/course-twin-full]
    paths:
      - "tools/course-twin-builder/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/course-twin-builder.yml"

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run builder:test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/course-twin-builder/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/forekinghell-course-twin-builder:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/forekinghell-course-twin-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

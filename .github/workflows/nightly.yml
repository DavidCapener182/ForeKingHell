name: Nightly quality

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_E2E_AUTH_BYPASS: "1"
      - run: npm run build
      - run: npm run test:lighthouse

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  bundle-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forekinghell
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SCORECARD_PROOF_SECRET: ci-scorecard-proof-secret-32-characters
      CRON_SECRET: ci-cron-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:analyze
      - run: npm run check:route-budgets
      - uses: actions/upload-artifact@v4
        with:
          name: next-bundle-analysis
          path: .next/diagnostics/analyze
          retention-days: 14
